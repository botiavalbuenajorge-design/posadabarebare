<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamiento de Citas Médicas</title>
    <!-- Tailwind CSS para diseño moderno y adaptable a móviles/tablets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 para alertas bonitas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0284c7;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden">
        <!-- Encabezado -->
        <div class="bg-sky-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">Reserva tu Cita Médica</h1>
            <p class="text-sky-100 text-sm mt-1">Selecciona la fecha y hora disponible</p>
        </div>

        <!-- Formulario -->
        <form id="citaForm" class="p-6 space-y-4">
            
            <!-- Nombre Completo -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nombre Completo *</label>
                <input type="text" id="nombre" required placeholder="Ej: María Pérez"
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
            </div>

            <!-- Cédula y Edad en la misma fila en PC, apilados en móvil -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Cédula / ID *</label>
                    <input type="text" id="cedula" required placeholder="Ej: V-12345678"
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Edad *</label>
                    <input type="number" id="edad" required min="0" max="120" placeholder="Ej: 32"
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>
            </div>

            <!-- Teléfono -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Teléfono (WhatsApp) *</label>
                <input type="tel" id="telefono" required placeholder="Ej: +58 414 1234567"
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
            </div>

            <hr class="border-slate-200 my-4">

            <!-- Selección de Fecha -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Fecha de la Cita *</label>
                <input type="date" id="fecha" required
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
            </div>

            <!-- Selección de Hora (Dinámica según disponibilidad) -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-sm font-medium text-slate-700">Hora Disponible *</label>
                    <span id="loadingHoras" class="hidden text-xs text-sky-600 flex items-center gap-1">
                        <span class="loader"></span> Consultando agenda...
                    </span>
                </div>
                <select id="hora" required disabled
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg bg-slate-50 focus:ring-2 focus:ring-sky-500 focus:outline-none disabled:opacity-60">
                    <option value="">Primero selecciona una fecha...</option>
                </select>
                <p id="mensajeDisponibilidad" class="text-xs text-slate-500 mt-1"></p>
            </div>

            <!-- Botón de Envío -->
            <button type="submit" id="btnSubmit"
                class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md mt-4 flex justify-center items-center gap-2">
                <span>Confirmar Cita</span>
            </button>
        </form>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE CONEXIÓN CON N8N
        // ==========================================
        // Reemplaza estas URLs con las de tus nodos Webhook en n8n
        const N8N_WEBHOOK_DISPONIBILIDAD = "https://TU-INSTANCIA-N8N.com/webhook/consultar-disponibilidad";
        const N8N_WEBHOOK_AGENDAR        = "https://TU-INSTANCIA-N8N.com/webhook/agendar-cita";

        // Horarios base de atención del consultorio
        const HORARIOS_CONSULTORIO = [
            "08:00 AM", "08:30 AM", "09:00 AM", "09:30 AM",
            "10:00 AM", "10:30 AM", "11:00 AM", "11:30 AM",
            "02:00 PM", "02:30 PM", "03:00 PM", "03:30 PM",
            "04:00 PM", "04:30 PM"
        ];

        // Referencias al DOM
        const inputFecha = document.getElementById('fecha');
        const selectHora = document.getElementById('hora');
        const loadingHoras = document.getElementById('loadingHoras');
        const msgDisponibilidad = document.getElementById('mensajeDisponibilidad');
        const form = document.getElementById('citaForm');
        const btnSubmit = document.getElementById('btnSubmit');

        // Bloquear fechas pasadas en el calendario
        const hoy = new Date().toISOString().split('T')[0];
        inputFecha.setAttribute('min', hoy);

        // Evento: Cuando el usuario cambia la fecha, consultar n8n
        inputFecha.addEventListener('change', async (e) => {
            const fechaSeleccionada = e.target.value;
            if (!fechaSeleccionada) return;

            selectHora.disabled = true;
            selectHora.innerHTML = '<option value="">Cargando horarios...</option>';
            loadingHoras.classList.remove('hidden');
            msgDisponibilidad.textContent = "";

            try {
                // Petición GET a n8n enviando la fecha como parámetro
                const response = await fetch(`${N8N_WEBHOOK_DISPONIBILIDAD}?fecha=${fechaSeleccionada}`);
                
                if (!response.ok) throw new Error("Error al conectar con el servidor");
                
                // Se espera que n8n devuelva un JSON como: { "ocupadas": ["08:30 AM", "10:00 AM"] }
                const data = await response.json();
                const horasOcupadas = data.ocupadas || [];

                actualizarSelectHoras(horasOcupadas);

            } catch (error) {
                console.error("Error consultando disponibilidad:", error);
                // Modo fallback por si aún no conectas n8n (muestra todas como libres para pruebas)
                actualizarSelectHoras([]); 
                msgDisponibilidad.textContent = "⚠️ Modo prueba: Conecta el Webhook GET de n8n para filtrar horas ocupadas.";
            } finally {
                loadingHoras.classList.add('hidden');
            }
        });

        function actualizarSelectHoras(horasOcupadas) {
            selectHora.innerHTML = '<option value="">Selecciona una hora...</option>';
            let disponiblesCount = 0;

            HORARIOS_CONSULTORIO.forEach(hora => {
                const option = document.createElement('option');
                option.value = hora;

                if (horasOcupadas.includes(hora)) {
                    option.textContent = `${hora} - (No disponible)`;
                    option.disabled = true;
                } else {
                    option.textContent = hora;
                    disponiblesCount++;
                }
                selectHora.appendChild(option);
            });

            if (disponiblesCount === 0) {
                selectHora.innerHTML = '<option value="">No hay turnos disponibles este día</option>';
                selectHora.disabled = true;
            } else {
                selectHora.disabled = false;
            }
        }

        // Evento: Enviar formulario para guardar cita
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                nombre: document.getElementById('nombre').value.trim(),
                cedula: document.getElementById('cedula').value.trim(),
                edad: parseInt(document.getElementById('edad').value),
                telefono: document.getElementById('telefono').value.trim(),
                fecha: inputFecha.value,
                hora: selectHora.value,
                fechaRegistro: new Date().toISOString()
            };

            // Deshabilitar botón mientras envía
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span class="loader"></span> Procesando reserva...';

            try {
                const response = await fetch(N8N_WEBHOOK_AGENDAR, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                // Si n8n responde que alguien ganó el turno justo antes
                if (response.status === 409 || result.status === 'ocupado') {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Turno recién ocupado',
                        text: 'Otro paciente acaba de reservar esa hora. Por favor elige otro horario.',
                    });
                    // Recargar horas disponibles
                    inputFecha.dispatchEvent(new Event('change'));
                    return;
                }

                if (!response.ok) throw new Error("Error al guardar la cita");

                Swal.fire({
                    icon: 'success',
                    title: '¡Cita Confirmada!',
                    html: `Te esperamos el <b>${payload.fecha}</b> a las <b>${payload.hora}</b>.<br>Hemos registrado tus datos correctamente.`,
                    confirmButtonColor: '#0284c7'
                });

                form.reset();
                selectHora.innerHTML = '<option value="">Primero selecciona una fecha...</option>';
                selectHora.disabled = true;

            } catch (error) {
                console.error(error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error de conexión',
                    text: 'No se pudo registrar la cita. Verifica tu conexión o intenta más tarde.'
                });
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<span>Confirmar Cita</span>';
            }
        });
    </script>
</body>
</html>
